name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy:
    name: no papers, no raw downloads, no secrets, style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail if papers, PDFs outside the allowlist, archives or saved web pages are committed
        run: python3 scripts/check_repo_policy.py
      - name: Secrets scan
        run: python3 scripts/scan_secrets.py
      - name: Style lint (no em dashes, no unapproved emojis, no affiliation)
        run: python3 scripts/check_style.py
      - name: Retracted claims do not reappear
        run: python3 scripts/check_claims.py
      - name: Round 4 result files carry one label vocabulary
        run: python3 scripts/check_labels.py
      - name: Every registered claim matches its data file
        run: pip install pandas && python3 scripts/check_numbers.py
      - name: Bibliography is current and every cited key exists
        run: python3 scripts/check_citations.py
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -t .
      - run: python3 -m unittest discover -s linksim/tests -t .
      - run: cd planner && python3 -m unittest
      - name: Round 4 model tests (energy, boot chain, mission, cycle model, board kit)
        run: |
          python3 -m unittest discover -s energy -t .
          python3 -m unittest discover -s bootchain -t .
          python3 -m unittest discover -s mission -t .
          python3 -m unittest discover -s cyclemodel -t .
          python3 -m unittest discover -s bench/board_kit/tests
          python3 -m unittest discover -s rtlsim -t .
          python3 -m unittest discover -s formal -t .
          python3 -m unittest discover -s stats -t .
          python3 -m unittest discover -s netsim -t .
          python3 -m unittest discover -s flightstack -t .
          python3 -m unittest discover -s sitl -t .
      - name: Planner agrees with the hand written expectations
        run: python3 scripts/compare_planner_predictions.py
  data:
    name: generated files match the data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Evidence table regenerates from raw notes, corrections and the pqm4 rule
        run: |
          python3 scripts/merge_evidence.py
          git diff --exit-code data/evidence.csv
      - name: Report markdown regenerates from the evidence table
        run: |
          python3 scripts/build_report.py
          git diff --exit-code docs/REPORT.md
      - name: Verification summary regenerates
        run: |
          python3 scripts/summarize_verification2.py > /dev/null
          git diff --exit-code docs/VERIFICATION2.md data/verify2/summary.csv
      - name: Third verification summary regenerates
        run: |
          python3 scripts/summarize_verification3.py > /dev/null
          git diff --exit-code docs/VERIFICATION3.md data/verify3/summary.csv
      - name: Meta analysis regenerates from the evidence table
        run: |
          python3 scripts/meta_analysis.py
          git diff --exit-code docs/META_ANALYSIS.md data/meta/
      - name: Network simulator study regenerates from its committed results
        run: |
          python3 -m netsim.compare > /dev/null
          python3 -m netsim.make_study > /dev/null
          git diff --exit-code netsim/results docs/NETSIM_STUDY.md
      - name: Mission study and reference architecture regenerate from the committed mission results
        run: |
          python3 -m mission.run_all --reuse > /dev/null
          git diff --exit-code docs/MISSION_STUDY.md docs/REFERENCE_ARCHITECTURE.md docs/figures/mission
      - name: README regenerates from the data files
        run: |
          python3 scripts/make_readme.py > /dev/null
          git diff --exit-code README.md
      - name: Data dictionary regenerates from the result files
        run: |
          python3 scripts/build_data_dictionary.py > /dev/null
          git diff --exit-code docs/DATA_DICTIONARY.md
      - name: Paper and claims register regenerate from the result files
        run: |
          python3 scripts/make_paper_figures.py > /dev/null
          python3 scripts/build_paper.py
          git diff --exit-code docs/PAPER.md docs/PROPOSAL_ROBOTICS*.md docs/PROPOSAL_BRIEF.md data/claims_register.csv
      - name: Flight stack memory and planner rerun regenerate from the committed build artefacts
        run: |
          pip install SALib numpy
          python3 flightstack/extract_memory.py
          cd planner && python3 flightstack_study.py && cd ..
          git diff --exit-code data/flightstack_memory.csv data/flightstack_memory_regions.csv docs/FLIGHTSTACK_STUDY.md planner/results/flightstack_*.csv
      - name: Proposal regenerates from the result files
        run: |
          python3 scripts/build_proposal.py
          git diff --exit-code docs/PROPOSAL_ATRC.md
